<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ValueBet">
<title>ValueBet Scout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1512;--card:#16211C;--card2:#1D2B24;--line:#24342C;--text:#EEF3EF;--soft:#C9D6CF;--muted:#9AABA2;--acc:#C8F169;--blue:#7CC4FF;--warn:#FFB27A;--nav:#121C17}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
a{color:var(--acc)}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700}
header{padding:calc(18px + env(safe-area-inset-top)) 16px 10px;max-width:640px;width:100%;margin:0 auto}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;letter-spacing:.5px}
.brand span{color:var(--acc)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
main{flex:1;padding:4px 16px 100px;max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:0;font-size:12px;padding:8px 12px;border-radius:999px;background:var(--card2);color:var(--soft);white-space:nowrap;cursor:pointer;min-height:34px}
.chip.on{background:var(--acc);color:var(--bg);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bet{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;cursor:pointer;font-size:inherit}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) 46px 58px 40px;gap:6px;align-items:center}
.head{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:0 12px}
.r{text-align:right}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.small{font-size:11px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.b>i{background:var(--blue)}
.tag{font-size:11px;font-weight:700;color:var(--bg);background:var(--acc);padding:3px 7px;border-radius:5px;display:inline-block}
.tag.b{background:var(--blue)}.tag.w{background:var(--warn)}.tag.g{background:#2A3A32;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:500}
.kpi span{font-size:24px}
.sect{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:6px 4px 0}
.step{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}
.step:last-child{border-bottom:0}
.btn{border:0;cursor:pointer;background:var(--acc);color:var(--bg);font-weight:700;font-size:15px;padding:14px;border-radius:12px;width:100%;min-height:48px}
.btn.ghost{background:var(--card2);color:var(--text)}
.link{border:0;background:none;color:var(--acc);font-size:14px;padding:10px 0;cursor:pointer;text-align:left;min-height:44px}
.stake{display:flex;align-items:center;gap:8px}
.sq{border:0;width:44px;height:44px;border-radius:10px;background:var(--card2);font-size:22px;font-weight:600;cursor:pointer}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hist{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.badge{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--bg)}
.pos{color:var(--acc)}.neg{color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);padding:6px 4px calc(10px + env(safe-area-inset-bottom))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:11px;font-weight:600;color:var(--muted);min-height:48px}
nav button.on{color:var(--acc)}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:20px 4px;text-align:center}
.place{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle{border:0;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;min-height:36px}
p{margin:0}
</style>
</head>
<body>
<header>
  <div class="brand">VALUEBET <span>SCOUT</span></div>
  <div class="sub" id="sub">Laden…</div>
</header>
<main id="main"></main>
<nav><div class="in">
  <button data-tab="top" aria-label="Top bets"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Top bets</button>
  <button data-tab="combi" aria-label="Combi's"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>Combi's</button>
  <button data-tab="tracker" aria-label="Tracker"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Tracker</button>
  <button data-tab="alerts" aria-label="Meldingen"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Meldingen</button>
</div></nav>

<script>
const S = { tab: 'top', sel: null, league: 'Alle', latest: null, history: null, stake: 10, mode: 'claude', placed: {},
  combi: {}, csize: 4, budget: 30,
  F: { sort: 'score', minP: 0, minOdds: 0, minScore: 0, show: 'all', open: false } };
try { S.combi = JSON.parse(localStorage.getItem('mycombi') || '{}'); S.budget = +localStorage.getItem('budget') || 30; } catch (e) {}
try { Object.assign(S.F, JSON.parse(localStorage.getItem('filters') || '{}'), { open: false }); } catch (e) {}
try { S.stake = +localStorage.getItem('stake') || 10; S.placed = JSON.parse(localStorage.getItem('placed') || '{}'); } catch (e) {}
const persist = () => { try { localStorage.setItem('stake', S.stake); localStorage.setItem('placed', JSON.stringify(S.placed)); localStorage.setItem('filters', JSON.stringify(S.F)); localStorage.setItem('mycombi', JSON.stringify(S.combi)); localStorage.setItem('budget', S.budget); } catch (e) {} };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = x => (+x).toFixed(2).replace('.', ',');
const pc = (x, d = 0) => (x * 100).toFixed(d).replace('.', ',') + '%';
const spc = x => (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(1).replace('.', ',') + '%';
const eur = x => (x >= 0 ? '+€' : '−€') + f2(Math.abs(x));
const sc = x => (+x).toFixed(1).replace('.', ',');
const when = iso => { const d = new Date(iso); return d.toLocaleDateString('nl-BE', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' }); };
const FLAME = '<svg aria-label="Risicobet" role="img" width="16" height="16" viewBox="0 0 24 24" fill="#FF9A4D" style="vertical-align:-2px"><path d="M12 2c1 3.5-1.5 5.5-1.5 8 0 1.4 1 2.5 2.3 2.5 1.6 0 2.4-1.4 2.2-3.2C17.6 11 19 13.6 19 16a7 7 0 0 1-14 0c0-4.4 3.6-6.7 5-9.2C10.6 5.3 11.3 3.6 12 2z"/></svg>';
const isRisky = b => (b.category || 'risky') === 'risky';
const evClass = x => x >= 0 ? 'pos' : 'neg';
const weekStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
function advice(b) {
  const unit = S.budget / 10;
  let st, why;
  if (b.ev > 0) {
    st = Math.min(unit * 2, Math.max(unit * 0.5, S.budget * (b.kelly || 0) / 4));
    if (isRisky(b)) st = Math.min(st, unit * 0.75);
    why = 'Positieve value: hoe groter het voordeel, hoe meer je inzet (een kwart van de Kelly-formule, begrensd).';
  } else {
    st = unit * 0.5;
    why = 'Geen value: Unibet betaalt minder dan eerlijk. Als je toch inzet, houd het klein.';
  }
  return { stake: Math.max(1, Math.round(st)), why };
}
function realWeek() {
  const ws = weekStart().getTime(), bets = S.history?.bets || [];
  let pnl = 0, staked = 0, open = 0;
  for (const k in S.placed) {
    const h = bets.find(x => x.key === k), st = +S.placed[k];
    if (!h || new Date(h.kickoff).getTime() < ws) continue;
    staked += st;
    if (h.status === 'won') pnl += st * (h.odds - 1); else if (h.status === 'lost') pnl -= st; else open++;
  }
  return { pnl, staked, open, limitHit: -pnl >= S.budget };
}
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;

async function load() {
  const t = Date.now();
  try {
    const [l, h] = await Promise.all([
      fetch('data/latest.json?t=' + t).then(r => r.ok ? r.json() : null),
      fetch('data/history.json?t=' + t).then(r => r.ok ? r.json() : null)
    ]);
    S.latest = l; S.history = h || { bets: [] };
  } catch (e) { S.latest = null; S.history = { bets: [] }; }
  render();
}

function subtitle() {
  const l = S.latest;
  if (!l) return 'Nog geen data. De eerste update volgt na de ochtendronde.';
  const ns = (l.bets || []).filter(b => !isRisky(b)).length, nr = (l.bets || []).filter(isRisky).length;
  const base = `Update ${when(l.generated_at)} · ${ns} favorieten · ${nr} risicobets`;
  const today = new Date().toISOString().slice(0, 10);
  return base + (l.research_date ? ' · nieuws gecheckt' : ' · nieuws nog niet gecheckt');
}

function render() {
  document.getElementById('sub').textContent = ({ top: subtitle(), combi: 'Combi’s van 2 tot 6 matchen, met de kans dat ze uitkomen', tracker: 'Claude zet elke week in op 10 bets: volg of dat winst oplevert', alerts: 'Nieuws, promo’s en status' })[S.tab];
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const m = document.getElementById('main');
  m.innerHTML = S.tab === 'top' ? (S.sel ? detail() : list()) : S.tab === 'combi' ? combi() : S.tab === 'tracker' ? tracker() : alerts();
  const view = S.tab + '|' + S.sel;
  if (view !== S._view) { window.scrollTo(0, 0); S._view = view; }
}

function row(b, i) {
  return `<button class="card bet" data-bet="${esc(b.key)}">
    <div class="row">
      <span class="num" style="font-size:20px;color:var(--muted)">${i + 1}</span>
      <div style="min-width:0"><div class="small ell">${esc(b.league)} · ${when(b.kickoff)}</div><div class="ell" style="font-size:14px;font-weight:600">${isRisky(b) ? FLAME + ' ' : ''}${esc(b.match)}</div></div>
      <span class="r" style="font-weight:600">${pc(b.p)}</span>
      <span class="r ${evClass(b.ev)}" style="font-weight:700">${spc(b.ev)}</span>
      <span class="r num" style="font-size:22px">${sc(b.score)}</span>
    </div>
    <div class="place"><span style="font-size:13px;color:var(--soft)">Tip: <strong style="color:var(--text)">${esc(b.pick)}</strong> @ ${f2(b.odds)}${b.promo ? ' <span class="tag b">PROMO</span>' : ''}${b.claude_pick ? ' <span class="tag" style="background:#7CC4FF">CLAUDE ZET IN</span>' : ''}${S.placed[b.key] ? ' <span class="tag">INGEZET</span>' : ''}</span>
    <div class="bar" style="width:84px"><i style="width:${b.score * 10}%;${isRisky(b) ? 'background:#FF9A4D' : ''}"></i></div></div>
  </button>`;
}

const SORTS = { score: ['Claude-cijfer', b => -b.score], p: ['Winkans', b => -b.p], odds: ['Hoogste odds', b => -b.odds], ev: ['Value', b => -b.ev] };
function fchips(key, opts, fmtv) {
  return opts.map(v => `<button class="chip ${S.F[key] === v ? 'on' : ''}" data-f="${key}" data-v="${v}">${fmtv(v)}</button>`).join('');
}
function filters(n) {
  const F = S.F, active = (F.minP ? 1 : 0) + (F.minOdds ? 1 : 0) + (F.minScore ? 1 : 0) + (F.show !== 'all' ? 1 : 0);
  return `<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">
    <div class="place"><span style="font-size:13px;font-weight:600">Sorteer</span><button class="link" style="padding:0;min-height:32px" data-ftoggle>${F.open ? 'Filters verbergen' : `Filters${active ? ` (${active})` : ''}`}</button></div>
    <div class="chips">${Object.keys(SORTS).map(k => `<button class="chip ${F.sort === k ? 'on' : ''}" data-f="sort" data-v="${k}">${SORTS[k][0]}</button>`).join('')}</div>
    ${F.open ? `
    <span class="small">Tonen</span>
    <div class="chips">${fchips('show', ['all', 'safe', 'risky', 'claude'], v => ({ all: 'Alles', safe: 'Favorieten', risky: FLAME + ' Risico', claude: 'Claude zet in' })[v])}</div>
    <span class="small">Minimale winkans</span>
    <div class="chips">${fchips('minP', [0, 0.5, 0.6, 0.7, 0.8], v => v ? Math.round(v * 100) + '%+' : 'Alle')}</div>
    <span class="small">Minimale odds</span>
    <div class="chips">${fchips('minOdds', [0, 1.3, 1.5, 1.7, 2], v => v ? f2(v) + '+' : 'Alle')}</div>
    <span class="small">Minimaal Claude-cijfer</span>
    <div class="chips">${fchips('minScore', [0, 4, 5, 6, 7], v => v ? v + '+' : 'Alle')}</div>
    <button class="link" style="padding:0;min-height:32px" data-freset>Filters wissen</button>` : ''}
    <span class="small">${n} bets</span>
  </div>`;
}

function list() {
  const all = (S.latest?.bets || []);
  if (!all.length) return `<div class="empty">Nog geen bets vandaag. De update volgt om 8u.</div>`;
  const F = S.F;
  const leagues = ['Alle', ...new Set(all.map(b => b.league))];
  const keep = b => (S.league === 'Alle' || b.league === S.league) && b.p >= F.minP && b.odds >= F.minOdds && b.score >= F.minScore
    && (F.show === 'all' || (F.show === 'claude' ? b.claude_pick : F.show === 'risky' ? isRisky(b) : !isRisky(b)));
  const sorter = (x, y) => SORTS[F.sort][1](x) - SORTS[F.sort][1](y);
  const shown = all.filter(keep).sort(sorter);
  const safe = shown.filter(b => !isRisky(b)), risky = shown.filter(isRisky);
  const head = `<div class="row head"><span>#</span><span>Bet</span><span class="r">Kans</span><span class="r">Value</span><span class="r">Cijfer</span></div>`;
  return `<div class="chips">${leagues.map(l => `<button class="chip ${l === S.league ? 'on' : ''}" data-league="${esc(l)}">${esc(l)}</button>`).join('')}</div>
  ${realWeek().limitHit ? `<div class="card" style="border-color:var(--warn);font-size:14px;line-height:1.5"><b class="neg">Weeklimiet bereikt</b><br>Je staat deze week ${eur(realWeek().pnl)} op je echte inzetten (budget €${S.budget}). Advies: niets meer inzetten tot maandag.</div>` : ''}
  ${filters(shown.length)}
  ${F.show !== 'risky' ? `<div class="sect">Grote kans om te winnen</div>
  <p class="small" style="line-height:1.5;padding:0 4px">Favorieten (${Math.round((S.latest?.settings?.safe_prob || .55) * 100)}%+ winkans). Het Claude-cijfer weegt zekerheid, de hoogte van de odds, de prijs t.o.v. eerlijke odds en een tweede model (ClubElo).</p>
  ${head}${safe.length ? safe.map(row).join('') : '<div class="empty" style="padding:8px">Geen favorieten binnen deze filters.</div>'}` : ''}
  ${F.show === 'all' || F.show === 'risky' || (F.show === 'claude' && risky.length) ? `<div class="sect" style="margin-top:8px">${FLAME} Risico met hoge x-factor</div>
  <p class="small" style="line-height:1.5;padding:0 4px">Outsiders waarvoor Unibet duidelijk te veel betaalt. Je verliest de meeste, maar op lange termijn leveren ze het meest op. Klein inzetten.</p>
  ${head}${risky.length ? risky.map(row).join('') : '<div class="empty" style="padding:8px">Geen risicobets binnen deze filters.</div>'}` : ''}
  <p class="small" style="line-height:1.5;padding:4px">Kans = geschatte winkans. Value = kans × odds − 1: positief betekent dat Unibet meer betaalt dan eerlijk, negatief is de marge die je betaalt. Odds van Unibet NL (zelfde platform als unibet.be): controleer ze op unibet.be voor je inzet.</p>`;
}

function detail() {
  const b = (S.latest?.bets || []).find(x => x.key === S.sel);
  if (!b) { S.sel = null; return list(); }
  const placed = S.placed[b.key];
  return `<button class="link" data-back>← Terug naar top bets</button>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:6px">
    <span class="small" style="font-size:12px">${esc(b.league)} · ${when(b.kickoff)}</span>
    ${isRisky(b) ? `<span class="tag w" style="align-self:flex-start;background:#FF9A4D">RISICOBET</span>` : `<span class="tag" style="align-self:flex-start">GROTE KANS</span>`}
    <span style="font-size:20px;font-weight:700">${esc(b.match)}</span>
    <span style="font-size:14px;color:var(--soft)">Tip: <strong style="color:var(--text)">${esc(b.pick)}</strong> @ ${f2(b.odds)}${b.best_odds > b.odds ? ` <span class="small">(beste markt ${f2(b.best_odds)})</span>` : ''}</span>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><b>Winkans</b><span class="num">${pc(b.p)}</span></div>
      <div class="kpi"><b>${isRisky(b) ? 'X-factor' : 'Value'}</b><span class="num ${evClass(b.ev)}">${spc(b.ev)}</span></div>
      <div class="kpi"><b>Claude-cijfer</b><span class="num">${sc(b.score)}</span></div>
    </div>
  </div>
  ${b.claude_pick ? `<div class="card" style="padding:16px;border-color:#7CC4FF;display:flex;flex-direction:column;gap:6px">
    <span class="tag b" style="align-self:flex-start">CLAUDE ZET HIER €10 OP IN</span>
    <p style="font-size:14px;line-height:1.55;color:var(--soft)">${esc(b.pick_reason || '')}</p></div>` : ''}
  ${(b.why || []).length ? `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div class="sect" style="padding:0">Waarom deze bet?</div>
    ${b.why.map(t => `<p style="font-size:14px;line-height:1.55;color:var(--soft)">${esc(t)}</p>`).join('')}
  </div>` : ''}
  ${(b.community || []).length ? `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px">
    <div class="sect" style="padding:0">Wat zeggen tipsters?</div>
    ${b.community.map(c => `<p style="font-size:14px;line-height:1.5;color:var(--soft)">${esc(c.note || '')}${safeUrl(c.url) ? ` <a href="${esc(c.url)}" target="_blank" rel="noopener" style="font-size:12px">${esc(c.source || 'bron')}</a>` : ''}</p>`).join('')}
    <p class="small" style="line-height:1.5">Tips van fora tellen niet mee in de kans: ze zijn op lange termijn niet beter dan de markt.</p>
  </div>` : ''}
  <div class="card" style="padding:16px">
    <div class="sect" style="padding:0 0 6px">Van marktkans naar eigen kans</div>
    ${b.steps.map(s => `<div class="step"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-weight:600">${esc(s.label)}</span><span class="small" style="font-size:12px">${esc(s.note)}</span>${(s.sources || []).map(safeUrl).filter(Boolean).map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener" style="font-size:12px">Bron ${i + 1}</a>`).join(' ')}</div><span style="font-weight:700;white-space:nowrap;${s.final || String(s.val).startsWith('+') ? 'color:var(--acc)' : ''}">${esc(s.val)}</span></div>`).join('')}
  </div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div class="sect" style="padding:0">Opbouw Claude-cijfer</div>
    ${b.parts.map(p => `<div><div class="place" style="font-size:13px"><span>${esc(p[0])}</span><b>${sc(p[1])}</b></div><div class="bar b" style="margin-top:4px"><i style="width:${p[1] * 10}%"></i></div></div>`).join('')}
  </div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px">
    <div class="sect" style="padding:0">Inzetadvies</div>
    <div class="place"><span style="font-size:14px;color:var(--soft)">Van je weekbudget €${S.budget}</span><span class="num" style="font-size:30px">€${advice(b).stake}</span></div>
    <p class="small" style="line-height:1.5">${esc(advice(b).why)}${realWeek().limitHit ? ' <b class="neg">Je weeklimiet is bereikt.</b>' : ''}</p>
    <div style="border-top:1px solid var(--line);padding-top:8px;font-size:14px;line-height:1.5;color:var(--soft)"><b style="color:var(--text)">Odds vergelijken:</b> Unibet geeft ${f2(b.odds)}, de eerlijke odds zijn <b style="color:var(--text)">${f2(b.fair_odds || 1 / b.p)}</b>. Geeft Bwin, Napoleon of een andere Belgische bookmaker meer dan ${f2(b.odds)}, zet dan daar in. Vanaf ${f2(b.fair_odds || 1 / b.p)} heb je echt value.</div>
  </div>
  <button class="btn ${placed ? 'ghost' : ''}" data-place="${esc(b.key)}" data-stake-amt="${advice(b).stake}">${placed ? `Ingezet (€${placed}) · tik om te wissen` : `Ik heb dit ingezet (€${advice(b).stake})`}</button>
  <button class="btn ghost" data-addcombi="${esc(b.key)}">${S.combi[b.match_id] && S.combi[b.match_id].key === b.key ? '✓ In mijn combi · tik om te verwijderen' : '+ Toevoegen aan mijn combi'}</button>
  <a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="https://www.unibet.be/betting/sports/filter/football" target="_blank" rel="noopener">Open Unibet</a>`;
}

function combiCard(x, title, extra) {
  const eff = x.odds_boosted || x.odds;
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="place"><span style="font-size:16px;font-weight:700">${esc(title)}</span>${x.boost_name ? `<span class="tag">${esc(x.boost_name)}</span>` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">
      ${x.legs.map(l => `<div class="place"><div style="min-width:0"><div class="ell"><b>${esc(l.pick)}</b> <span class="small">${Math.round(l.p * 100)}%</span></div><div class="small ell" style="font-size:12px">${esc(l.match)}${l.kickoff ? ' · ' + when(l.kickoff) : ''}</div></div><span style="white-space:nowrap">${f2(l.odds)}${extra ? ` <button class="link" style="padding:0 0 0 8px;min-height:32px" data-unpick="${esc(l.key)}" aria-label="Verwijder ${esc(l.pick)}">✕</button>` : ''}</span></div>`).join('')}
      <div class="place" style="color:var(--muted);border-top:1px solid var(--line);padding-top:8px"><span>Totale odds</span><span>${f2(x.odds)}</span></div>
      ${x.odds_boosted ? `<div class="place" style="color:var(--muted)"><span>Met promo</span><span class="pos" style="font-weight:600">${f2(x.odds_boosted)}</span></div>` : ''}
    </div>
    <div class="kpis">
      <div class="kpi"><b>Kans combi</b><span class="num">${pc(x.p)}</span></div>
      <div class="kpi"><b>Value</b><span class="num ${evClass(x.ev)}">${spc(x.ev)}</span></div>
      <div class="kpi"><b>€10 wordt</b><span class="num">€${f2(10 * eff)}</span></div>
    </div>
    ${(x.why || []).length ? `<details><summary class="link" style="list-style:none;padding:0;min-height:32px">Waarom deze combi?</summary>${x.why.map(t => `<p style="font-size:13px;line-height:1.55;color:var(--soft);margin-top:6px">${esc(t)}</p>`).join('')}</details>` : ''}
  </div>`;
}

function myCombi() {
  const legs = Object.values(S.combi);
  if (!legs.length) return `<div class="card" style="font-size:13px;line-height:1.5;color:var(--soft)"><b style="color:var(--text)">Maak je eigen combi</b><br>Open een bet bij Top bets en tik op “+ Toevoegen aan mijn combi”. Hier zie je dan de totale odds en de kans dat alles lukt.</div>`;
  let odds = 1, p = 1;
  legs.forEach(l => { odds *= l.odds; p *= l.p; });
  const x = { legs, odds, p, ev: p * odds - 1, why: [] };
  return combiCard(x, `Mijn combi (${legs.length})`, true) + `<button class="btn ghost" data-clearcombi>Mijn combi wissen</button>`;
}

function combi() {
  const all = S.latest?.combis || [], pr = S.latest?.promos || [];
  const sizes = [...new Set(all.map(c => c.n))].sort();
  if (!sizes.includes(S.csize)) S.csize = sizes.includes(4) ? 4 : sizes[0];
  const shown = all.filter(c => c.n === S.csize);
  let h = myCombi();
  h += `<div class="sect">Voorgestelde combi’s</div>
  <p class="small" style="line-height:1.5;padding:0 4px">Uit favorieten met minstens 62% winkans, alle wedstrijden binnen 4 dagen. Per aantal: de zekerste combi en die met de beste prijs.</p>`;
  h += sizes.length ? `<div class="chips">${sizes.map(n => `<button class="chip ${n === S.csize ? 'on' : ''}" data-csize="${n}">${n} matchen</button>`).join('')}</div>` + shown.map(x => combiCard(x, x.label || `${x.n}-combi`)).join('') : `<div class="empty">Vandaag niet genoeg sterke favorieten voor een combi.</div>`;
  h += `<p class="small" style="line-height:1.5;padding:0 4px">Let op: hoe meer matchen, hoe hoger de odds, maar ook hoe groter de kans dat één wedstrijd misloopt. De marge van Unibet stapelt zich bij elke selectie op. Een combi-boost kan dat deels goedmaken.</p>`;
  h += `<div class="sect">Promo’s van vandaag</div>`;
  h += pr.length ? pr.map(p => `<div class="card place"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">${esc(p.name)}</span><span class="small" style="font-size:12px">${esc(p.note || '')}</span></div>${safeUrl(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" style="font-size:13px;white-space:nowrap">Bekijk</a>` : ''}</div>`).join('') : `<div class="empty" style="padding:8px">Geen promo’s gevonden vandaag.</div>`;
  return h;
}

function portfolio() {
  const pf = S.latest?.portfolio, t = pf?.total;
  const picks = (S.history?.bets || []).filter(b => b.claude_pick).sort((a, b) => b.kickoff.localeCompare(a.kickoff));
  const weekOf = w => picks.filter(b => b.pick_week === w);
  const head = `<div class="chips">${modeChips()}</div>`;
  if (!pf || !pf.weeks.length) return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">${head}
    <p style="font-size:14px;line-height:1.55;color:var(--soft)">Elke week kiest Claude ${pf?.per_week || 10} bets en zet er zogezegd telkens €${pf?.stake || 10} op in. Hier zie je per week of dat winst of verlies oplevert. De eerste keuzes volgen bij het volgende ochtendonderzoek.</p></div>`;
  const pnlTxt = x => `<span class="${x >= 0 ? 'pos' : 'neg'}">${eur(x)}</span>`;
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">${head}
    <span class="small" style="text-transform:uppercase;letter-spacing:.6px">Totaal Claude (10 × €10 per week)</span>
    <span class="num ${t.pnl >= 0 ? 'pos' : 'neg'}" style="font-size:48px;line-height:1">${eur(t.pnl)}</span>
    <div class="kpis">
      <div><div class="small">Ingezet</div><b style="font-size:16px">€${f2(t.staked)}</b></div>
      <div><div class="small">ROI</div><b style="font-size:16px">${spc(t.roi)}</b></div>
      <div><div class="small">Raak</div><b style="font-size:16px">${t.won} / ${t.settled}</b></div>
    </div>
    <p class="small" style="line-height:1.5">Winstgevende weken: ${t.weeks_positive} van ${pf.weeks.filter(w => !w.open).length} afgesloten. Beoordeel pas na 8–10 weken: één week zegt weinig.</p>
  </div>
  ${pf.weeks.map(w => `<div class="card" style="padding:14px;display:flex;flex-direction:column;gap:8px">
    <div class="place"><span style="font-weight:700">Week ${esc(w.label)}</span><span style="font-weight:700">${w.won + w.lost ? pnlTxt(w.pnl) : '<span class="small">bezig</span>'}</span></div>
    ${w.report ? `<div style="background:var(--card2);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--soft)"><b style="color:var(--text)">Weekrapport van Claude</b><br>${esc(w.report)}</div>` : ''}
    ${w.breakdown ? `<div class="small" style="font-size:12px;line-height:1.6">${['type', 'league'].map(d => Object.entries(w.breakdown[d]).map(([k, v]) => `${esc(k)}: ${v.won}/${v.n} raak, <span class="${v.pnl >= 0 ? 'pos' : 'neg'}">${eur(v.pnl)}</span>`).join(' · ')).join('<br>')}</div>` : ''}
    <span class="small" style="font-size:12px">${w.n}/${pf.per_week} bets · ${w.won} gewonnen · ${w.lost} verloren${w.open ? ` · ${w.open} nog te spelen` : ''}${w.void ? ` · ${w.void} nietig` : ''}</span>
    ${weekOf(w.week).map(b => {
      const r = b.status === 'won' ? b.pick_stake * (b.pick_odds - 1) : b.status === 'lost' ? -b.pick_stake : null;
      const map = { won: ['W', 'var(--acc)'], lost: ['V', 'var(--warn)'] }[b.status] || [b.status === 'void' ? '–' : '…', '#2A3A32'];
      return `<details style="border-top:1px solid var(--line);padding-top:8px"><summary style="list-style:none;cursor:pointer" class="hist">
        <span class="badge" style="background:${map[1]};${r === null ? 'color:var(--text)' : ''}">${map[0]}</span>
        <div style="min-width:0"><div class="ell" style="font-size:13px;font-weight:600">${isRisky(b) ? FLAME + ' ' : ''}${esc(b.pick)} @ ${f2(b.pick_odds)}</div><div class="small ell" style="font-size:12px">${esc(b.match)} · ${when(b.kickoff)}${b.result ? ' · ' + esc(b.result) : ''}</div></div>
        <span style="font-weight:700;font-size:14px" class="${r === null ? '' : r >= 0 ? 'pos' : 'neg'}">${r === null ? (b.status === 'void' ? 'nietig' : 'open') : eur(r)}</span></summary>
        <p style="font-size:13px;line-height:1.5;color:var(--soft);padding:6px 0 2px 38px">${esc(b.pick_reason || '')}</p></details>`;
    }).join('')}
  </div>`).join('')}`;
}

function modeChips() {
  return [['claude', 'Claude (10/week)'], ['real', 'Echt ingezet'], ['check', 'Klopt het?'], ['paper', 'Alle tips'], ['safe', 'Grote kans'], ['risky', 'Risico']].map(([k, l]) => `<button class="chip ${S.mode === k ? 'on' : ''}" data-mode="${k}">${k === 'risky' ? FLAME + ' ' : ''}${l}</button>`).join('');
}

function calib() {
  const c = S.latest?.calibration;
  const head = `<div class="chips">${modeChips()}</div>`;
  if (!c || c.n < 10) return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">${head}
    <p style="font-size:14px;line-height:1.55;color:var(--soft)">Hier zie je straks of de kansen van de app kloppen: winnen bets met “70% kans” ook echt ongeveer 7 op 10 keer? Daarvoor zijn minstens 10 afgeronde bets nodig${c ? ` (nu ${c.n})` : ''}. Betrouwbaar wordt het vanaf ±200.</p></div>`;
  const bar = (v, col) => `<div class="bar" style="height:8px"><i style="width:${Math.round(v * 100)}%;background:${col}"></i></div>`;
  const verdict = Math.abs(c.hit_avg - c.pred_avg) < 0.04 ? 'De kansen kloppen tot nu toe goed.' : c.hit_avg > c.pred_avg ? 'Tot nu toe winnen er meer bets dan voorspeld.' : 'Tot nu toe winnen er minder bets dan voorspeld: de app is te optimistisch.';
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">${head}
    <span class="small" style="text-transform:uppercase;letter-spacing:.6px">${c.n} afgeronde bets</span>
    <div class="kpis">
      <div class="kpi"><b>Voorspeld</b><span class="num">${pc(c.pred_avg)}</span></div>
      <div class="kpi"><b>Werkelijk</b><span class="num">${pc(c.hit_avg)}</span></div>
      <div class="kpi"><b>Odds vs slot</b><span class="num ${evClass(c.clv || 0)}">${c.clv == null ? '—' : spc(c.clv)}</span></div>
    </div>
    <p style="font-size:14px;line-height:1.5;color:var(--soft)">${verdict} ${c.n < 200 ? 'Met minder dan 200 bets is dit nog grotendeels toeval.' : ''}</p>
    <p class="small" style="line-height:1.5">“Odds vs slot”: hoeveel beter de odds bij het tippen waren dan de eerlijke marktprijs vlak voor aftrap. Positief = de app vindt bets voordat de markt ze ontdekt; dat is het sterkste teken dat het werkt.</p>
  </div>
  <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="sect" style="padding:0">Per kansgroep</div>
    <div class="place small"><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#7CC4FF"></span> voorspeld</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--acc)"></span> werkelijk</span></div>
    ${c.rows.map(r => `<div style="display:flex;flex-direction:column;gap:4px">
      <div class="place" style="font-size:13px"><b>${esc(r.label)}</b><span class="small">${r.n} bets · ${pc(r.pred)} → ${pc(r.hit)}</span></div>
      ${bar(r.pred, '#7CC4FF')}${bar(r.hit, 'var(--acc)')}</div>`).join('')}
  </div>`;
}

function budgetCard() {
  const w = realWeek();
  return `<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px">
    <span style="font-size:13px;font-weight:600">Weekbudget (stoplimiet)</span>
    <div class="grid4">${[20, 30, 50, 100].map(v => `<button class="chip ${v === S.budget ? 'on' : ''}" data-budget="${v}" style="padding:12px 0;font-size:14px">€${v}</button>`).join('')}</div>
    <p class="small" style="line-height:1.5">Deze week: ${eur(w.pnl)} op €${f2(w.staked)} ingezet${w.open ? `, ${w.open} nog open` : ''}. ${w.limitHit ? '<b class="neg">Limiet bereikt: niets meer inzetten tot maandag.</b>' : `Stop als je €${S.budget} verloren hebt.`}</p>
  </div>`;
}

function tracker() {
  if (S.mode === 'claude') return portfolio();
  if (S.mode === 'check') return calib();
  const all = (S.history?.bets || []).slice().sort((a, b) => b.kickoff.localeCompare(a.kickoff));
  const rows = S.mode === 'real' ? all.filter(b => S.placed[b.key]) : all.filter(b => b.tracked !== false && (S.mode === 'paper' || (S.mode === 'safe' ? !isRisky(b) : isRisky(b))));
  let pnl = 0, staked = 0, won = 0, settled = 0, clvSum = 0, clvN = 0;
  rows.forEach(b => {
    const st = S.mode === 'real' ? +S.placed[b.key] : S.stake;
    if (b.status === 'won') { pnl += st * (b.odds - 1); won++; settled++; staked += st; }
    else if (b.status === 'lost') { pnl -= st; settled++; staked += st; }
    if (typeof b.clv === 'number') { clvSum += b.clv; clvN++; }
  });
  const roi = staked ? pnl / staked : 0;
  return `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">
    <div class="chips">${modeChips()}</div>
    <span class="small" style="text-transform:uppercase;letter-spacing:.6px">Resultaat${S.mode !== 'real' ? ' met vaste inzet' : ''}</span>
    <span class="num ${pnl >= 0 ? 'pos' : 'neg'}" style="font-size:48px;line-height:1">${eur(pnl)}</span>
    <div class="kpis" style="font-size:12px">
      <div><div class="small">Ingezet</div><b style="font-size:16px">€${f2(staked)}</b></div>
      <div><div class="small">ROI</div><b style="font-size:16px">${spc(roi)}</b></div>
      <div><div class="small">Raak</div><b style="font-size:16px">${won} / ${settled}</b></div>
    </div>
    ${clvN ? `<p class="small" style="line-height:1.5">Gemiddeld kregen de tips ${spc(clvSum / clvN)} betere odds dan de markt vlak voor aftrap. Positief op lange termijn = het model werkt.</p>` : ''}
    ${S.mode === 'real' ? budgetCard() : ''}${S.mode !== 'real' ? `<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px">
      <span style="font-size:13px;font-weight:600">Inzet per bet</span>
      <div class="stake"><button class="sq" aria-label="Inzet verlagen" data-stake="-5">−</button><span class="num" style="flex:1;text-align:center;font-size:30px">€${S.stake}</span><button class="sq" aria-label="Inzet verhogen" data-stake="5">+</button></div>
      <div class="grid4">${[5, 10, 20, 50].map(v => `<button class="chip ${v === S.stake ? 'on' : ''}" data-setstake="${v}" style="padding:12px 0;font-size:14px">€${v}</button>`).join('')}</div>
    </div>` : ''}
  </div>
  <div class="sect">Gevolgde bets</div><p class="small" style="line-height:1.5;padding:0 4px">Elke dag de 5 beste favorieten en de risicobets met score ${sc(S.latest?.settings?.track_score || 7)} of meer.</p>
  ${rows.length ? rows.map(b => {
    const st = S.mode === 'real' ? +S.placed[b.key] : S.stake;
    const map = { won: ['W', 'var(--acc)'], lost: ['V', 'var(--warn)'], open: ['…', '#2A3A32'], void: ['–', '#2A3A32'] }[b.status] || ['?', '#2A3A32'];
    const r = b.status === 'won' ? st * (b.odds - 1) : b.status === 'lost' ? -st : null;
    return `<div class="card hist"><span class="badge" style="background:${map[1]};${b.status === 'open' || b.status === 'void' ? 'color:var(--text)' : ''}">${map[0]}</span>
      <div style="min-width:0"><div class="ell" style="font-size:13px;font-weight:600">${isRisky(b) ? FLAME + ' ' : ''}${esc(b.match)}</div><div class="small" style="font-size:12px">${esc(b.pick)} @ ${f2(b.odds)} · ${when(b.kickoff)}${b.result ? ' · ' + esc(b.result) : ''}</div></div>
      <span style="font-weight:700;font-size:14px" class="${r === null ? '' : r >= 0 ? 'pos' : 'neg'}">${r === null ? (b.status === 'void' ? 'nietig' : 'open') : eur(r)}</span></div>`;
  }).join('') : `<div class="empty">${S.mode === 'real' ? 'Nog niets gemarkeerd als ingezet. Tik bij een bet op “Ik heb dit ingezet”.' : 'Nog geen gevolgde tips. Elke tip met een hoge score komt hier automatisch.'}</div>`}`;
}

function alerts() {
  const l = S.latest || {};
  const al = l.alerts || [];
  const tagc = t => /ACHTERSTAND/i.test(t) ? '' : /BLESSURE|SCHORS/i.test(t) ? 'b' : 'g';
  return `${l.summary ? `<div class="card" style="font-size:14px;line-height:1.5;color:var(--soft)"><b style="color:var(--text)">Ochtendanalyse</b><br>${esc(l.summary)}</div>` : ''}
  ${al.length ? al.map(a => `<div class="card" style="display:flex;flex-direction:column;gap:6px;padding:14px">
    <div class="place"><span class="tag ${tagc(a.tag || '')}">${esc(a.tag || 'NIEUWS')}</span><span class="small" style="font-size:12px">${esc(a.time || '')}</span></div>
    <span style="font-size:14px;font-weight:600;line-height:1.4">${esc(a.title)}</span>
    <span style="font-size:13px;color:var(--soft);line-height:1.5">${esc(a.body || '')}</span>
    ${safeUrl(a.url) ? `<a href="${esc(a.url)}" target="_blank" rel="noopener" style="font-size:12px">Bron</a>` : ''}</div>`).join('') : `<div class="empty">Geen meldingen vandaag.</div>`}
  <div class="sect">Status</div>
  <div class="card" style="font-size:13px;line-height:1.7;color:var(--soft)">
    Odds opgehaald: ${l.fetched_at ? when(l.fetched_at) : '—'}<br>
    Nieuws gecheckt: ${l.research_date ? esc(l.research_date) : 'nog niet vandaag'}<br>
    Wedstrijden met odds: ${l.n_matches ?? '—'}<br>
    Waarvan met ClubElo-analyse: ${l.n_elo ?? '—'}<br>
    Gratis odds-credits over deze maand: ${esc(l.odds_remaining ?? '—')}
    ${(l.notes || []).map(n => '<br>' + esc(n)).join('')}
    ${(l.errors || []).length ? `<br><span class="neg">Datafouten:</span><br>${l.errors.map(e => '· ' + esc(e)).join('<br>')}` : ''}
  </div>
  <button class="btn ghost" data-reload>Opnieuw laden</button>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.sel = null; }
  else if (t.dataset.bet) S.sel = t.dataset.bet;
  else if ('back' in t.dataset) S.sel = null;
  else if (t.dataset.league) S.league = t.dataset.league;
  else if (t.dataset.csize) S.csize = +t.dataset.csize;
  else if (t.dataset.addcombi) {
    const b = (S.latest?.bets || []).find(x => x.key === t.dataset.addcombi);
    if (b) { if (S.combi[b.match_id] && S.combi[b.match_id].key === b.key) delete S.combi[b.match_id]; else S.combi[b.match_id] = { key: b.key, match: b.match, pick: b.pick, odds: b.odds, p: b.p, kickoff: b.kickoff }; persist(); }
  }
  else if (t.dataset.unpick) { for (const k in S.combi) if (S.combi[k].key === t.dataset.unpick) delete S.combi[k]; persist(); }
  else if ('clearcombi' in t.dataset) { S.combi = {}; persist(); }
  else if (t.dataset.f) { const v = t.dataset.v; S.F[t.dataset.f] = isNaN(+v) ? v : +v; persist(); }
  else if ('ftoggle' in t.dataset) S.F.open = !S.F.open;
  else if ('freset' in t.dataset) { Object.assign(S.F, { minP: 0, minOdds: 0, minScore: 0, show: 'all' }); persist(); }
  else if (t.dataset.mode) S.mode = t.dataset.mode;
  else if (t.dataset.stake) { S.stake = Math.max(1, Math.min(500, S.stake + +t.dataset.stake)); persist(); }
  else if (t.dataset.setstake) { S.stake = +t.dataset.setstake; persist(); }
  else if (t.dataset.place) { const k = t.dataset.place; if (S.placed[k]) delete S.placed[k]; else S.placed[k] = +t.dataset.stakeAmt || S.stake; persist(); }
  else if (t.dataset.budget) { S.budget = +t.dataset.budget; persist(); }
  else if ('reload' in t.dataset) { load(); return; }
  else return;
  render();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
load();
</script>
