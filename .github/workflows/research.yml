name: Onderzoek verwerken en melden
on:
  push:
    paths:
      - "site/data/research.json"
      - "site/data/promos.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onderzoek toepassen
        run: python scripts/engine.py apply
      - name: Opslaan
        run: |
          git config user.name "valuebet-bot"
          git config user.email "valuebet-bot@users.noreply.github.com"
          git add site/data cache
          git diff --cached --quiet || git commit -m "data: onderzoek verwerkt"
          git pull --rebase
          git push
