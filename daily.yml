name: Dagelijkse odds-update
on:
  schedule:
    - cron: "15 5 * * *"   # 06:15 Belgische wintertijd, 07:15 zomertijd
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Odds en teamdata ophalen en rekenen
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/engine.py fetch
      - name: Opslaan
        run: |
          git config user.name "valuebet-bot"
          git config user.email "valuebet-bot@users.noreply.github.com"
          git add site/data cache
          git diff --cached --quiet || git commit -m "data: dagelijkse odds-update"
          git pull --rebase
          git push
